<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Filtrage Pollution par Pays</title>
</head>
<body>

    <h1>Pollution CO₂ par pays (2023)</h1>

    <div class="filtres">
        <label for="min">MIN :</label>
        <input type="number" id="min" placeholder="" step="any">
        <label for="max">MAX :</label>
        <input type="number" id="max" placeholder="" step="any">
        <button id="valider">Valider</button>
    </div>

    <div class="info" id="info"></div>

    <table>
        <thead>
            <tr>
                <th>Pays</th>
                <th>Valeur (milliards de tonnes)</th>
                <th>Pourcentage</th>
                <th>Code</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>

    <script src="tp10-test.js"></script>
</body>
</html>
